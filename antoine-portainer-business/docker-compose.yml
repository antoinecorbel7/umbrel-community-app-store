version: '3.7'
services:
  app_proxy:
    environment:
      APP_HOST: portainer_portainer_business_1
      APP_PORT: 9000
      PROXY_AUTH_ADD: "false"
    container_name: portainer_app_proxy_1
  docker:
    image: >-
      docker:29.9.2-dind@sha256:ba3d67c44952ffc448696659a36ef91dd813f03a9c70a2bc0ad1d286d542f4fb
    privileged: true
    network_mode: host
    stop_grace_period: 1m
    restart: on-failure
    environment:
      DOCKER_ENSURE_BRIDGE: dind0:10.32.0.1/16
    entrypoint: /entrypoint.sh
    command: |
      dockerd
        --bridge dind0
        --data-root /data/data
        --exec-root /data/exec
        --host unix:///data/docker.sock
        --pidfile /data/docker.pid
    volumes:
      - ${APP_DATA_DIR}/entrypoint.sh:/entrypoint.sh
      - ${APP_DATA_DIR}/data/docker:/data
      - ${UMBREL_ROOT}/home/Downloads:/downloads
    container_name: portainer_docker_1
  portainer:
    image: >-
      portainer/portainer-ee:2.45.3@sha256:8166e2376756d1ad3194e336cd1707c28a5764af7acc8bb9f21a5f28d1903566
    command: '--host unix:///var/run/docker.sock --admin-password-file=/default-password'
    restart: on-failure
    ports:
      - "8000:8000"
    volumes:
      - ${APP_DATA_DIR}/default-password:/default-password
      - ${APP_DATA_DIR}/data/portainer:/data
      - ${APP_DATA_DIR}/data/docker:/var/run
      - ${UMBREL_ROOT}/home/Downloads:/downloads
    container_name: portainer_portainer_business_1
